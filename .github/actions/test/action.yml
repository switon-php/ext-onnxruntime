name: Build and test
description: Install one PHP build, compile the extension against ONNX Runtime, and run make test.
inputs:
  php:
    description: PHP minor version, such as 8.4
    required: true
  ts:
    description: nts or zts
    required: true
  upload:
    description: Upload the release library when true
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install readelf
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y binutils

    - name: Install Windows build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        choco install llvm make -y --no-progress
        echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

    - name: Install PHP ${{ inputs.php }} ${{ inputs.ts }}
      id: php-sdk
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.php }}" in
          8.2|8.3) vs=vs16 ;;
          *) vs=vs17 ;;
        esac
        case "${{ inputs.ts }}" in
          zts) tspart=Win32 ;;
          *) tspart=nts-Win32 ;;
        esac
        base="https://downloads.php.net/~windows/releases"
        revision=$(curl -fsSL "$base/" | python -c '
        import re, sys
        minor, tspart, vs = sys.argv[1:]
        html = sys.stdin.read()
        found = set(re.findall(
            r"php-devel-pack-(" + re.escape(minor) + r"\.\d+(?:-\d+)?)-"
            + re.escape(tspart) + "-" + re.escape(vs) + r"-x64\.zip",
            html,
        ))
        if not found:
            sys.exit("no Windows devel pack for %s %s %s" % (minor, tspart, vs))
        def key(rev):
            main, _, pack = rev.partition("-")
            parts = [int(part) for part in main.split(".")]
            parts.append(int(pack) if pack else 0)
            return parts
        print(max(found, key=key))
        ' "${{ inputs.php }}" "$tspart" "$vs")
        echo "PHP revision $revision"
        root="$RUNNER_TEMP/php-build"
        rm -rf "$root"
        mkdir -p "$root"
        curl -fsSL -o "$root/php.zip" "$base/php-${revision}-${tspart}-${vs}-x64.zip"
        curl -fsSL -o "$root/devel.zip" "$base/php-devel-pack-${revision}-${tspart}-${vs}-x64.zip"
        curl -fsSL -o "$root/sdk.zip" "https://github.com/php/php-sdk-binary-tools/releases/download/php-sdk-2.3.0/php-sdk-binary-tools-php-sdk-2.3.0.zip"
        unzip -q "$root/php.zip" -d "$root/php-bin"
        unzip -q "$root/devel.zip" -d "$root/devel-src"
        unzip -q "$root/sdk.zip" -d "$root/sdk-src"
        if [ ! -f "$root/php-bin/php.exe" ]; then
          bin=$(find "$root/php-bin" -name php.exe -type f | head -n 1)
          test -n "$bin"
          prefix=$(dirname "$bin")
        else
          prefix=$root/php-bin
        fi
        dev=$(find "$root/devel-src" -mindepth 1 -maxdepth 1 -type d -name 'php-*-devel-*' | head -n 1)
        test -n "$dev"
        test -f "$dev/phpize.bat"
        msys=$(find "$root/sdk-src" -type d -path '*/msys2/usr/bin' | head -n 1)
        test -n "$msys"
        test -x "$msys/bison.exe"
        test -x "$msys/re2c.exe"
        cygpath -w "$prefix" >> "$GITHUB_PATH"
        cygpath -w "$dev" >> "$GITHUB_PATH"
        cygpath -w "$msys" >> "$GITHUB_PATH"
        echo "prefix=$(cygpath -w "$prefix")" >> "$GITHUB_OUTPUT"

    - name: Select the MSVC toolset
      id: msvc
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        case "${{ inputs.php }}" in
          8.2|8.3) prefix=14.29 ;;
          *) prefix=14.44 ;;
        esac
        matches=(/c/Program\ Files/Microsoft\ Visual\ Studio/*/Enterprise/VC/Tools/MSVC/${prefix}.*)
        if [ ${#matches[@]} -eq 0 ]; then
          echo "PHP ${{ inputs.php }} is linked with MSVC ${prefix}, and that toolset is not installed" >&2
          exit 1
        fi
        match=$(printf '%s\n' "${matches[@]}" | sort -V | tail -n 1)
        toolset=$(basename "$match")
        edition=${match%/VC/Tools/MSVC/*}
        vsdev="$edition/Common7/Tools/VsDevCmd.bat"
        test -f "$vsdev"
        echo "MSVC toolset $toolset"
        echo "toolset=$toolset" >> "$GITHUB_OUTPUT"
        echo "vsdev=$(cygpath -w "$vsdev")" >> "$GITHUB_OUTPUT"

    - name: Enable the MSVC developer prompt
      if: runner.os == 'Windows'
      shell: bash
      env:
        TOOLSET: ${{ steps.msvc.outputs.toolset }}
        VSDEV: ${{ steps.msvc.outputs.vsdev }}
      run: |
        set -euo pipefail
        before=$(mktemp)
        after=$(mktemp)
        setup=$(mktemp --suffix=.bat)
        cmd //c set > "$before"
        printf '%s\n' '@echo off' \
          "call \"$VSDEV\" -arch=x64 -host_arch=x64 -vcvars_ver=$TOOLSET >nul" \
          'if errorlevel 1 exit /b 1' \
          'set' > "$setup"
        cmd //c "$(cygpath -w "$setup")" > "$after"
        BEFORE="$before" AFTER="$after" python -c '
        import os
        def load(path):
            data = open(path, "rb").read()
            text = data.decode("utf-16") if data.startswith(b"\xff\xfe") else data.decode("mbcs", "replace")
            env = {}
            for line in text.splitlines():
                if not line or line.startswith("=") or "=" not in line:
                    continue
                key, value = line.split("=", 1)
                if key and "\n" not in value:
                    env[key] = value
            return env
        before = load(os.environ["BEFORE"])
        after = load(os.environ["AFTER"])
        changed = [key for key in after if before.get(key) != after[key]]
        if "Path" not in changed and "PATH" not in changed:
            raise SystemExit("VsDevCmd did not set PATH")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as out:
            for key in changed:
                out.write(f"{key}={after[key]}\n")
        '

    - name: Install PHP ${{ inputs.php }} ${{ inputs.ts }}
      if: runner.os != 'Windows'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php }}
        coverage: none
      env:
        phpts: ${{ inputs.ts }}

    - name: Download ONNX Runtime 1.31.1
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux)
            case "$(uname -m)" in
              x86_64) asset=onnxruntime-linux-x64-1.31.1.tgz ;;
              aarch64) asset=onnxruntime-linux-aarch64-1.31.1.tgz ;;
              *) echo "unsupported CPU $(uname -m)" >&2; exit 1 ;;
            esac
            ;;
          Darwin)
            case "$(uname -m)" in
              arm64) asset=onnxruntime-osx-arm64-1.31.1.tgz ;;
              x86_64) asset=onnxruntime-osx-x86_64-1.31.1.tgz ;;
              *) echo "unsupported CPU $(uname -m)" >&2; exit 1 ;;
            esac
            ;;
          MINGW*|MSYS*|CYGWIN*)
            asset=onnxruntime-win-x64-1.31.1.zip
            ;;
          *)
            echo "unsupported OS $(uname -s)" >&2
            exit 1
            ;;
        esac
        curl -fsSL -o ort.pkg "https://github.com/microsoft/onnxruntime/releases/download/v1.31.1/${asset}"
        rm -rf deps
        mkdir -p deps
        case "$asset" in
          *.zip) unzip -q ort.pkg -d deps ;;
          *) tar -xzf ort.pkg -C deps ;;
        esac
        prefix=$(find deps -mindepth 1 -maxdepth 1 -type d -name 'onnxruntime-*' | head -1)
        test -n "$prefix"
        echo "ORT=$PWD/$prefix" >> "$GITHUB_ENV"

    - name: Test
      shell: bash
      env:
        EXPECTED_PHP: ${{ inputs.php }}
        EXPECTED_TS: ${{ inputs.ts }}
        UPLOAD: ${{ inputs.upload }}
        PHP_PREFIX: ${{ steps.php-sdk.outputs.prefix }}
      run: |
        set -euo pipefail
        ver=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
        ts=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
        echo "PHP $ver $ts"
        php -v
        if [ "$ver" != "$EXPECTED_PHP" ] || [ "$ts" != "$EXPECTED_TS" ]; then
          echo "expected PHP ${EXPECTED_PHP} ${EXPECTED_TS}, got ${ver} ${ts}" >&2
          exit 1
        fi
        case "$(uname -s)" in
          MINGW*|MSYS*|CYGWIN*) export PATH="$ORT/lib:$PATH" ;;
        esac
        set +e
        make test
        test_status=$?
        set -e
        echo "make test exit ${test_status}"
        if [[ "$test_status" -ne 0 ]]; then
          exit "$test_status"
        fi
        lib=$(tr -d '[:space:]' < target/ext-library)
        bash "$GITHUB_ACTION_PATH/check-linkage.sh" "$lib"
        if [ "$UPLOAD" != "true" ]; then
          exit 0
        fi
        case "$(uname -m)" in
          x86_64|amd64|AMD64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *)
            echo "unsupported CPU $(uname -m)" >&2
            exit 1
            ;;
        esac
        case "$(uname -s)" in
          Linux) platform=linux ;;
          Darwin) platform=macos ;;
          MINGW*|MSYS*|CYGWIN*) platform=windows ;;
        esac
        name=$(basename "$lib")
        ort=$(tr -d '[:space:]' < target/ort-library)
        ort_name=$(basename "$ort")
        rm -rf dist
        mkdir -p dist/pkg
        cp "$lib" "dist/pkg/$name"
        cp -L "$ort" "dist/pkg/$ort_name"
        if [ ! -s target/ext-version ]; then
          echo "target/ext-version is missing" >&2
          exit 1
        fi
        pkg_ver=$(tr -d '[:space:]' < target/ext-version)
        case "$pkg_ver" in
          v*) pie_ver=$pkg_ver ;;
          [0-9]*) pie_ver=v$pkg_ver ;;
          *) pie_ver=$pkg_ver ;;
        esac
        tar -C dist/pkg -czf "dist/onnxruntime-${pkg_ver}-php${ver}-${ts}-${platform}-${arch}.tar.gz" "$name" "$ort_name"
        case "$arch" in
          x64) pie_arch=x86_64 ;;
          arm64) pie_arch=arm64 ;;
        esac
        case "$platform" in
          linux)
            pie_zip="dist/php_onnxruntime-${pie_ver}_php${ver}-${pie_arch}-linux-glibc-${ts}.zip"
            pie_member=onnxruntime.so
            ;;
          macos)
            pie_zip="dist/php_onnxruntime-${pie_ver}_php${ver}-${pie_arch}-darwin-bsdlibc-${ts}.zip"
            pie_member=onnxruntime.so
            ;;
          windows)
            case "$ts" in
              zts) win_ts=ts ;;
              *) win_ts=nts ;;
            esac
            case "$ver" in
              8.2|8.3) compiler=vs16 ;;
              *) compiler=vs17 ;;
            esac
            pie_member="php_onnxruntime-${pie_ver}-${ver}-${win_ts}-${compiler}-x86_64.dll"
            pie_zip="dist/${pie_member%.dll}.zip"
            ;;
        esac
        python3 -c 'import os, sys, zipfile
        z = zipfile.ZipFile(sys.argv[1], "w", compression=zipfile.ZIP_DEFLATED)
        z.write(sys.argv[2], sys.argv[3])
        z.write(sys.argv[4], os.path.basename(sys.argv[4]))
        ' "$pie_zip" "dist/pkg/$name" "$pie_member" "dist/pkg/$ort_name"
        rm -rf dist/pkg

    - name: Upload library
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: onnxruntime-${{ inputs.php }}-${{ inputs.ts }}-${{ runner.os }}-${{ runner.arch }}
        path: dist/*
        if-no-files-found: error
